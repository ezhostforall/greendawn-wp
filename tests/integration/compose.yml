# Disposable integration-test stack. Not used as a Codespaces devcontainer.
# Local-only credentials; never deploy this configuration to a hosting server.
services:
  db:
    image: mariadb:11
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: local-test-only
      MARIADB_ROOT_PASSWORD: local-root-only
    # Share this disposable test namespace with Apache to avoid inter-container
    # bridge traffic in this isolated test stack.
    # Only the WordPress HTTP port is forwarded; MariaDB remains private.
    ports:
      - "127.0.0.1:8080:80"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
    volumes:
      - db_data:/var/lib/mysql

  wordpress:
    image: wordpress:php8.3-apache
    depends_on:
      db:
        condition: service_healthy
    # WordPress/Apache and MariaDB share one network namespace. This is solely
    # for the isolated integration test stack; never use it for production.
    network_mode: "service:db"
    environment:
      WORDPRESS_DB_HOST: 127.0.0.1:3306
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: local-test-only
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DEBUG: "1"
      # This WordPress instance is exclusively for disposable CI/integration tests.
      WORDPRESS_CONFIG_EXTRA: |
        define( 'WP_ENVIRONMENT_TYPE', 'local' );
        define( 'WP_DEBUG_LOG', true );
        define( 'WP_DEBUG_DISPLAY', false );
        define( 'DISALLOW_FILE_EDIT', true );
    volumes:
      - wp_data:/var/www/html
      - ../../theme:/var/www/html/wp-content/themes/greendawn:ro
      - ../../plugins/greendawn-core:/var/www/html/wp-content/plugins/greendawn-core:ro
      - ../../plugins/ezhost-updater:/var/www/html/wp-content/plugins/ezhost-updater:ro
      - ../../mu-plugins:/var/www/html/wp-content/mu-plugins:ro

volumes:
  db_data:
  wp_data:
